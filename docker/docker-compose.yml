version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentloop
      POSTGRES_PASSWORD: rentloop_secret
      POSTGRES_DB: rentloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentloop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentloop_redis
    restart: unless-stopped
    command: redis-server --requirepass rentloop_redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rentloop_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
